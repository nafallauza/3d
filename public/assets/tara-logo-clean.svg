<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 180 800 650" fill="none">
    <!-- Molecular Ligand Bonds (Struktur Atom / Ligand) -->
    <!-- Left Bond: Top Vertex Ring to Mid-Left Atom -->
    <path d="M 372 292 Q 332 346 306 398" stroke="#F4F6F9" stroke-opacity="0.9" stroke-width="16" stroke-linecap="round"/>
    <!-- Right Bond: Mid-Right Atom to Bottom-Right Vertex Ring -->
    <path d="M 496 368 Q 525 422 544 472" stroke="#F4F6F9" stroke-opacity="0.9" stroke-width="16" stroke-linecap="round"/>
    <!-- Bottom Bond: Bottom-Left Vertex Ring to Mid-Bottom Atom -->
    <path d="M 282 512 Q 352 526 416 526" stroke="#F4F6F9" stroke-opacity="0.9" stroke-width="16" stroke-linecap="round"/>

    <!-- 3 Primary Vertex Open Rings (Atom Nodes) -->
    <circle cx="400" cy="252" r="38" stroke="#F4F6F9" stroke-opacity="0.9" stroke-width="14" fill="#070E1A"/>
    <circle cx="238" cy="504" r="38" stroke="#F4F6F9" stroke-opacity="0.9" stroke-width="14" fill="#070E1A"/>
    <circle cx="562" cy="504" r="38" stroke="#F4F6F9" stroke-opacity="0.9" stroke-width="14" fill="#070E1A"/>

    <!-- 3 Secondary Blue Ligand Atoms -->
    <circle cx="474" cy="322" r="24" fill="#0B70AD" fill-opacity="0.85" stroke="#F4F6F9" stroke-opacity="0.35" stroke-width="1.5"/>
    <circle cx="288" cy="422" r="24" fill="#0B70AD" fill-opacity="0.85" stroke="#F4F6F9" stroke-opacity="0.35" stroke-width="1.5"/>
    <circle cx="466" cy="526" r="24" fill="#0B70AD" fill-opacity="0.85" stroke="#F4F6F9" stroke-opacity="0.35" stroke-width="1.5"/>

    <!-- Central Red Core Atom (Presisi Fundamental) -->
    <circle cx="400" cy="418" r="56" fill="#C91C22" fill-opacity="0.82" stroke="#F4F6F9" stroke-opacity="0.3" stroke-width="1.5"/>

    <!-- Dynamic Fluid Waves (Garis Gelombang Dinamis / Waves) -->
    <path d="M 96 655 C 194 560 324 565 448 618 C 544 658 628 655 704 612 C 658 668 554 685 434 642 C 314 598 194 595 96 655 Z" fill="#0B70AD" fill-opacity="1"/>
    <path d="M 130 688 C 225 622 340 632 450 680 C 533 715 610 712 670 692 C 617 745 510 752 410 708 C 310 665 213 658 130 688 Z" fill="#0B70AD" fill-opacity="0.85"/>
    <path d="M 172 724 C 262 692 352 712 446 748 C 512 772 580 768 628 742 C 566 798 442 812 316 782 C 362 780 412 772 452 760 C 356 748 262 718 172 724 Z" fill="#0B70AD" fill-opacity="0.7"/>
</svg>
