<svg width="808" height="1048" viewBox="0 0 808 1048" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="blueprintFade" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(404 480) rotate(90) scale(500 400)">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="72%" stop-color="#FFFFFF" stop-opacity="0.82"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <mask id="blueprintMask" style="mask-type:alpha" maskUnits="userSpaceOnUse" x="0" y="0" width="808" height="1048">
      <rect width="808" height="1048" fill="url(#blueprintFade)"/>
    </mask>
    <pattern id="cadGridSmall" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M 26 0 L 0 0 0 26" fill="none" stroke="#F4F6F9" stroke-opacity="0.045" stroke-width="0.6"/>
    </pattern>
    <pattern id="cadGridLarge" width="130" height="130" patternUnits="userSpaceOnUse">
      <rect width="130" height="130" fill="url(#cadGridSmall)"/>
      <path d="M 130 0 L 0 0 0 130" fill="none" stroke="#0B70AD" stroke-opacity="0.16" stroke-width="0.9"/>
    </pattern>
  </defs>

  <g mask="url(#blueprintMask)">
    <!-- Architectural CAD Grid Background -->
    <rect x="24" y="40" width="760" height="960" fill="url(#cadGridLarge)"/>

    <!-- Open Space Concept (Tanpa Lingkaran): Dissolved/Open Outer Arcs & Expansion Vectors -->
    <path d="M 190 250 A 260 260 0 0 1 590 250" stroke="#F4F6F9" stroke-opacity="0.16" stroke-width="1" stroke-dasharray="4 8"/>
    <path d="M 635 370 A 260 260 0 0 1 590 610" stroke="#0B70AD" stroke-opacity="0.24" stroke-width="1" stroke-dasharray="3 9"/>
    <path d="M 145 610 A 260 260 0 0 1 115 370" stroke="#0B70AD" stroke-opacity="0.24" stroke-width="1" stroke-dasharray="3 9"/>

    <!-- Out-of-the-box Corner Framing Brackets (Open Space) -->
    <path d="M 110 210 L 110 160 L 160 160" stroke="#F4F6F9" stroke-opacity="0.32" stroke-width="1.2"/>
    <path d="M 650 160 L 700 160 L 700 210" stroke="#F4F6F9" stroke-opacity="0.32" stroke-width="1.2"/>
    <path d="M 110 750 L 110 800 L 160 800" stroke="#F4F6F9" stroke-opacity="0.32" stroke-width="1.2"/>
    <path d="M 650 800 L 700 800 L 700 750" stroke="#F4F6F9" stroke-opacity="0.32" stroke-width="1.2"/>

    <!-- Upward Expansion Axis & Elevation Guides -->
    <line x1="380" y1="90" x2="380" y2="860" stroke="#F4F6F9" stroke-opacity="0.14" stroke-width="1" stroke-dasharray="5 5"/>
    <line x1="80" y1="418" x2="720" y2="418" stroke="#F4F6F9" stroke-opacity="0.12" stroke-width="1" stroke-dasharray="5 5"/>

    <!-- Upward Vector Arrow at Apex (Formasi Segitiga Arah Atas) -->
    <path d="M 380 125 L 368 148 M 380 125 L 392 148" stroke="#0B70AD" stroke-opacity="0.7" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="380" y1="125" x2="380" y2="210" stroke="#0B70AD" stroke-opacity="0.55" stroke-width="1.2"/>

    <!-- Outer Structural Triangle Construction Lines (Formasi Segitiga) -->
    <polygon points="380,195 600,545 160,545" stroke="#0B70AD" stroke-opacity="0.28" stroke-width="1" stroke-dasharray="6 4" fill="none"/>
    <polygon points="380,248 548,512 212,512" stroke="#F4F6F9" stroke-opacity="0.22" stroke-width="1.2" fill="rgba(11, 112, 173, 0.03)"/>

    <!-- Molecular Ligand Bonds (Struktur Atom / Ligand) -->
    <!-- Left Bond: Top Vertex Ring to Mid-Left Atom -->
    <path d="M 352 292 Q 312 346 286 398" stroke="#F4F6F9" stroke-opacity="0.55" stroke-width="10" stroke-linecap="round"/>
    <!-- Right Bond: Mid-Right Atom to Bottom-Right Vertex Ring -->
    <path d="M 476 368 Q 505 422 524 472" stroke="#F4F6F9" stroke-opacity="0.55" stroke-width="10" stroke-linecap="round"/>
    <!-- Bottom Bond: Bottom-Left Vertex Ring to Mid-Bottom Atom -->
    <path d="M 262 512 Q 332 526 396 526" stroke="#F4F6F9" stroke-opacity="0.55" stroke-width="10" stroke-linecap="round"/>

    <!-- 3 Primary Vertex Open Rings (Atom Nodes) -->
    <circle cx="380" cy="252" r="38" stroke="#F4F6F9" stroke-opacity="0.65" stroke-width="12" fill="#070E1A"/>
    <circle cx="218" cy="504" r="38" stroke="#F4F6F9" stroke-opacity="0.65" stroke-width="12" fill="#070E1A"/>
    <circle cx="542" cy="504" r="38" stroke="#F4F6F9" stroke-opacity="0.65" stroke-width="12" fill="#070E1A"/>

    <!-- 3 Secondary Blue Ligand Atoms -->
    <circle cx="454" cy="322" r="24" fill="#0B70AD" fill-opacity="0.85" stroke="#F4F6F9" stroke-opacity="0.35" stroke-width="1.5"/>
    <circle cx="268" cy="422" r="24" fill="#0B70AD" fill-opacity="0.85" stroke="#F4F6F9" stroke-opacity="0.35" stroke-width="1.5"/>
    <circle cx="446" cy="526" r="24" fill="#0B70AD" fill-opacity="0.85" stroke="#F4F6F9" stroke-opacity="0.35" stroke-width="1.5"/>

    <!-- Central Red Core Atom (Presisi Fundamental) -->
    <circle cx="380" cy="418" r="76" stroke="#C91C22" stroke-opacity="0.35" stroke-width="1" stroke-dasharray="3 3" fill="none"/>
    <circle cx="380" cy="418" r="56" fill="#C91C22" fill-opacity="0.82" stroke="#F4F6F9" stroke-opacity="0.3" stroke-width="1.5"/>

    <!-- Dynamic Fluid Waves (Garis Gelombang Dinamis / Waves) -->
    <path d="M 118 655 C 215 560, 345 565, 470 618 C 565 658, 650 655, 725 612 C 680 668, 575 685, 455 642 C 335 598, 215 595, 118 655 Z" fill="#0B70AD" fill-opacity="0.65"/>
    <path d="M 155 688 C 250 622, 365 632, 475 680 C 558 715, 635 712, 695 692 C 642 745, 535 752, 435 708 C 335 665, 238 658, 155 688 Z" fill="#0B70AD" fill-opacity="0.5"/>
    <path d="M 195 724 C 285 692, 375 712, 468 748 C 535 772, 602 768, 650 742 C 588 798, 465 812, 338 782 C 385 780, 435 772, 475 760 C 378 748, 285 718, 195 724 Z" fill="#0B70AD" fill-opacity="0.38"/>

    <!-- Blueprint Streamline Contours around Waves -->
    <path d="M 95 675 C 210 575, 355 580, 485 635 C 580 675, 665 670, 740 625" stroke="#F4F6F9" stroke-opacity="0.22" stroke-width="1" stroke-dasharray="4 4" fill="none"/>
    <path d="M 140 745 C 255 685, 380 715, 495 765 C 575 795, 645 780, 705 735" stroke="#0B70AD" stroke-opacity="0.35" stroke-width="1" fill="none"/>

    <!-- Dimension & Angle Ticks -->
    <circle cx="380" cy="195" r="3.5" fill="#0B70AD"/>
    <circle cx="600" cy="545" r="3.5" fill="#0B70AD"/>
    <circle cx="160" cy="545" r="3.5" fill="#0B70AD"/>
    <circle cx="650" cy="250" r="3" fill="#F4F6F9" fill-opacity="0.5"/>
    <circle cx="135" cy="250" r="3" fill="#F4F6F9" fill-opacity="0.5"/>
  </g>
</svg>
